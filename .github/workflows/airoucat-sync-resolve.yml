name: Resolve Airoucat upstream sync

on:
  push:
    branches:
      - sync/upstream-2026-08-10

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply conflict resolution
        run: python3 .github/airoucat-sync-resolve.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Airoucat overlay
        run: |
          pnpm --filter @mindfoldhq/trellis-core build
          pnpm --filter @mindfoldhq/trellis exec vitest run test/commands/airoucat.integration.test.ts
          pnpm --filter @mindfoldhq/trellis typecheck

      - name: Commit resolved sync
        run: |
          rm .github/workflows/airoucat-sync-resolve.yml .github/airoucat-sync-resolve.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: adapt Airoucat overlay to latest upstream"
          git push
